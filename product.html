<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTabTitle">Product | Pink World</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<div class="container" style="padding-top:30px;">
  <div id="productContent" class="product-detail"></div>
  <section class="section">
    <div class="section-head"><div><h2>You May Also Like</h2></div></div>
    <div class="product-grid" id="relatedGrid"></div>
  </section>
</div>

<div id="footer-placeholder"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/products-sync.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  initLayout("shop");
  const id = getParam("id");
  let selectedSize = null;
  let qty = 1;

  function renderProductDetail() {
    const product = PRODUCTS.find(p => p.id === id);

    if (!product) {
      document.getElementById("productContent").innerHTML = "<p>Product not found. <a href='shop.html'>Back to shop</a></p>";
      document.getElementById("relatedGrid").innerHTML = "";
      return;
    }
    if (!selectedSize || !product.sizes.includes(selectedSize)) selectedSize = product.sizes[0];

    document.getElementById("pageTabTitle").textContent = product.name + " | Pink World";
    const discount = product.mrp ? Math.round(100 - (product.price / product.mrp) * 100) : null;
    document.getElementById("productContent").innerHTML = `
      <div class="product-detail-img">
        <button type="button" class="wishlist-heart wishlist-heart-lg" data-wishlist-id="${product.id}" onclick="handleWishlistClick('${product.id}', this)" title="Add to wishlist">♡</button>
        <img src="${product.image}" alt="${product.name}">
      </div>
      <div class="product-detail-info">
        ${product.badge ? `<span class="badge ${product.badge.toLowerCase()}" style="position:static; display:inline-block; margin-bottom:10px;">${product.badge}</span>` : ""}
        <h1>${product.name}</h1>
        <p style="color:var(--text-muted); font-size:14px;">Category: ${CATEGORIES.find(c => c.id === product.category).name}</p>
        <div class="price-row">
          <span class="price">${formatPrice(product.price)}</span>
          ${product.mrp ? `<span class="mrp">${formatPrice(product.mrp)}</span><span class="discount">${discount}% OFF</span>` : ""}
        </div>
        <p>${product.description}</p>
        <h4 style="margin-top:20px; font-size:14px;">Select Size</h4>
        <div class="size-options" id="sizeOptions">
          ${product.sizes.map(s => `<button class="${s === selectedSize ? "selected" : ""}" onclick="selectSize('${s}', this)">${s}</button>`).join("")}
        </div>
        <h4 style="font-size:14px;">Quantity</h4>
        <div class="qty-selector">
          <button class="btn btn-outline btn-sm" onclick="changeQty(-1)">−</button>
          <span id="qtyDisplay">${qty}</span>
          <button class="btn btn-outline btn-sm" onclick="changeQty(1)">+</button>
        </div>
        <div class="detail-actions">
          <button class="btn btn-primary" onclick="addThisToCart()">Add to Cart</button>
          <button class="btn btn-whatsapp" onclick="orderNowWhatsApp()">Order Now on WhatsApp</button>
        </div>
        <p style="font-size:13px; color:var(--text-muted);">📍 Available at both Erattayar and Nedumkandam stores. Visit <a href="about.html" style="color:var(--pink-dark); font-weight:600;">Store Locations</a> for details.</p>
      </div>`;
    document.getElementById("relatedGrid").innerHTML = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4).map(productCardHtml).join("");
    refreshWishlistIcons();
  }

  function changeQty(delta) { qty = Math.max(1, qty + delta); document.getElementById("qtyDisplay").textContent = qty; }
  function selectSize(size, btn) {
    selectedSize = size;
    document.querySelectorAll("#sizeOptions button").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
  }
  function addThisToCart() { addToCart(id, selectedSize, qty); alert(`Added to cart! (Size: ${selectedSize}) x${qty}`); }
  function orderNowWhatsApp() { addToCart(id, selectedSize, qty); checkoutViaWhatsApp(); }

  renderProductDetail();
  subscribeProductsUpdates(renderProductDetail);
</script>
</body>
</html>
